<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" width="380" height="96">
  <defs>
    <linearGradient id="nav-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="nav-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Icône à gauche -->
  <g transform="translate(8, 8)">
    <!-- Mini Bouclier Hexagon/Tech -->
    <path d="M 40 4 L 72 16 V 42 C 72 62 58 73 40 78 C 22 73 8 62 8 42 V 16 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Soleil -->
    <circle cx="50" cy="30" r="12" fill="url(#nav-sun)" />
    <!-- Nuage -->
    <path d="M 23 54 A 9 9 0 0 1 23 36 A 16 16 0 0 1 54 32 A 11 11 0 0 1 58 54 Z" fill="url(#nav-cloud)" />
    <!-- Éclair -->
    <path d="M 43 41 L 33 55 L 40 55 L 36 69 L 49 51 L 41 51 Z" fill="#facc15" />
  </g>

  <!-- Texte DFWMeteo -->
  <text x="98" y="60" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="40" letter-spacing="-0.5">
    <tspan font-weight="800" fill="#f8fafc">DFW</tspan><tspan font-weight="400" fill="#38bdf8">Meteo</tspan>
  </text>

  <!-- Badge / Sous-titre optionnel (ligne radar) -->
  <rect x="100" y="70" width="54" height="3" rx="1.5" fill="#f59e0b" />
  <rect x="160" y="70" width="16" height="3" rx="1.5" fill="#38bdf8" opacity="0.6" />
</svg>