<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <meta
      name="description"
      content="DFWMeteo resolves twelve independent weather models into one calm, precise forecast. Built for Belgium, ready for everywhere."
    />
    <meta property="og:title" content="DFWMeteo — Weather, resolved" />
    <meta
      property="og:description"
      content="Twelve independent weather models. One confident forecast. A premium weather experience calibrated for Belgium."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./gemini-svg.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DFWMeteo" />
    <meta name="application-name" content="DFWMeteo" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./gemini-svg.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preload" href="./fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="./fonts/instrument-serif-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>DFWMeteo — Weather, resolved</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to forecast</a>
    <noscript>
      <div class="noscript">
        <strong>DFWMeteo</strong>
        <p>This weather app needs JavaScript to resolve the models. Please enable it and reload.</p>
      </div>
    </noscript>
    <div id="app">
      <div class="boot" id="boot">
        <div class="boot-orbit" aria-hidden="true">
          <span></span><span></span><span></span>
          <i></i>
          <svg class="boot-shield" width="48" height="54" viewBox="128 36 256 288" fill="none">
            <defs>
              <clipPath id="boot-shield-clip">
                <path d="M 256 48 L 372 92 V 185 C 372 257 321 296 256 314 C 191 296 140 257 140 185 V 92 Z" />
              </clipPath>
            </defs>
            <path d="M 256 48 L 372 92 V 185 C 372 257 321 296 256 314 C 191 296 140 257 140 185 V 92 Z" fill="#0f172a" />
            <g clip-path="url(#boot-shield-clip)">
              <circle cx="292" cy="142" r="43" fill="url(#dfw-brand-sun)" />
              <path d="M 195 228 A 32.5 32.5 0 0 1 195 163 A 58 58 0 0 1 306 149 A 40 40 0 0 1 321 228 Z" fill="url(#dfw-brand-cloud)" />
              <path d="M 267 181 L 231 232 L 256 232 L 242 282 L 288 217 L 260 217 Z" fill="#facc15" />
            </g>
            <path d="M 256 48 L 372 92 V 185 C 372 257 321 296 256 314 C 191 296 140 257 140 185 V 92 Z" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linejoin="round" />
          </svg>
        </div>
        <p class="boot-brand"><b>DFW</b><em>Meteo</em></p>
        <div class="boot-radar" aria-hidden="true"><span></span><span></span></div>
        <p class="boot-text">Resolving twelve skies</p>
        <div class="boot-line"><span></span></div>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

    <svg class="svg-defs" width="1" height="1" style="position:fixed;top:-100px;left:-100px;opacity:0.001;pointer-events:none;" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="dfw-brand-sun" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fde047" />
          <stop offset="100%" stop-color="#f97316" />
        </linearGradient>
        <linearGradient id="dfw-brand-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>
        <radialGradient id="wx-sun" cx="38%" cy="34%" r="72%">
          <stop offset="0%" stop-color="#fff6d8" />
          <stop offset="48%" stop-color="#f8d187" />
          <stop offset="100%" stop-color="#e8a94f" />
        </radialGradient>
        <radialGradient id="wx-sun-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f7cd83" stop-opacity=".5" />
          <stop offset="100%" stop-color="#f7cd83" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="wx-moon" x1="20%" y1="5%" x2="80%" y2="95%">
          <stop offset="0%" stop-color="#fbf7ea" />
          <stop offset="60%" stop-color="#dfe5ee" />
          <stop offset="100%" stop-color="#aebed8" />
        </linearGradient>
        <linearGradient id="wx-cloud" x1="18%" y1="8%" x2="82%" y2="96%">
          <stop offset="0%" stop-color="#fbfdff" />
          <stop offset="45%" stop-color="#dbe5f4" />
          <stop offset="100%" stop-color="#9fb2cf" />
        </linearGradient>
        <linearGradient id="wx-cloud-back" x1="18%" y1="8%" x2="82%" y2="96%">
          <stop offset="0%" stop-color="#bccbe1" />
          <stop offset="100%" stop-color="#7185a6" />
        </linearGradient>
        <linearGradient id="wx-rain" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#a7d4ff" />
          <stop offset="100%" stop-color="#5f9ce8" />
        </linearGradient>
        <linearGradient id="wx-bolt" x1="0%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#ffe2a1" />
          <stop offset="100%" stop-color="#f4b64f" />
        </linearGradient>
        <filter id="wx-soft" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="3" />
        </filter>
      </defs>
    </svg>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
