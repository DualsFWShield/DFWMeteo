<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fond de la carte carrée -->
    <linearGradient id="sq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Soleil -->
    <linearGradient id="sq-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Nuage bleu signature -->
    <linearGradient id="sq-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Masque de protection du bouclier -->
    <clipPath id="sq-shield-clip">
      <path d="M 256 48 L 372 92 V 185 C 372 257 321 296 256 314 C 191 296 140 257 140 185 V 92 Z" />
    </clipPath>
  </defs>

  <!-- Fond Carré Arrondi (Squircle) -->
  <rect width="512" height="512" rx="110" fill="url(#sq-bg)" />
  <rect width="506" height="506" x="3" y="3" rx="107" fill="none" stroke="#1e293b" stroke-width="6" />

  <!-- Icône Bouclier (Centrée en haut) -->
  <g>
    <!-- Bouclier Tech Fond -->
    <path d="M 256 48 L 372 92 V 185 C 372 257 321 296 256 314 C 191 296 140 257 140 185 V 92 Z" fill="#0f172a" />
    
    <!-- Contenu météo masqué -->
    <g clip-path="url(#sq-shield-clip)">
      <circle cx="292" cy="142" r="43" fill="url(#sq-sun)" />
      <path d="M 195 228 A 32.5 32.5 0 0 1 195 163 A 58 58 0 0 1 306 149 A 40 40 0 0 1 321 228 Z" fill="url(#sq-cloud)" />
      <path d="M 267 181 L 231 232 L 256 232 L 242 282 L 288 217 L 260 217 Z" fill="#facc15" />
    </g>

    <!-- Bordure du bouclier au premier plan -->
    <path d="M 256 48 L 372 92 V 185 C 372 257 321 296 256 314 C 191 296 140 257 140 185 V 92 Z" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linejoin="round" />
  </g>

  <!-- Typographie DFWMeteo centrée -->
  <text x="256" y="408" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="74" letter-spacing="-1">
    <tspan font-weight="800" fill="#f8fafc">DFW</tspan><tspan font-weight="400" fill="#38bdf8">Meteo</tspan>
  </text>

  <!-- Barres de soulignement (Orange + Bleu) -->
  <rect x="166" y="434" width="126" height="8" rx="4" fill="#f59e0b" />
  <rect x="306" y="434" width="40" height="8" rx="4" fill="#38bdf8" opacity="0.6" />
</svg>
