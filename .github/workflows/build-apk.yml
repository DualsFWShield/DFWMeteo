name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install dependencies
        run: npm ci

      - name: Build static web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK binary
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DFWMeteo.apk

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DFWMeteo-Android.apk
          path: DFWMeteo.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}"
          TITLE="${{ startsWith(github.ref, 'refs/tags/') && format('DFWMeteo {0}', github.ref_name) || 'DFWMeteo Android App' }}"

          cat << 'EOF' > release-notes.md
          ### 📱 DFWMeteo — Application Android (APK)

          Téléchargez et installez directement **`DFWMeteo.apk`** sur votre smartphone ou tablette Android.

          #### 🌤️ Fonctionnalités incluses :
          * **Consensus 12 modèles météo** : Synthèse pondérée en direct (ECMWF, ICON, Met Office, Météo-France, KNMI, MET Norway, DMI, BOM, NOAA, ECCC, JMA, CMA).
          * **Couche officielle IRM / KMI** : Requête native en direct sur l'Institut Royal Météorologique de Belgique (radar, alertes, observations).
          * **Expérience native Android** : Prise en charge du bouton retour matériel, affichage immersif plein écran, mode hors-ligne PWA.
          * **Commit** : ${{ github.sha }}
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating release notes and APK asset..."
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            gh release upload "$TAG" DFWMeteo.apk --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" DFWMeteo.apk \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --latest
          fi
